[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kioskforge"
version = "0.1.0"
description = "Raspberry Pi kiosk stack provisioner — Chromium, Docker Compose, firewall, and Tailscale from YAML"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Abhirama M", email = "mabhirama06a@gmail.com" }]
keywords = ["raspberry-pi", "kiosk", "chromium", "provisioning", "embedded"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Installation/Setup",
]
dependencies = [
  "typer[all]>=0.12.0",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
kioskforge = "kioskforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["kioskforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"kioskforge/cli.py" = ["B008"]
